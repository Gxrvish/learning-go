apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinykv
spec:
  replicas: 3
  selector: { matchLabels: { app: tinykv } }
  template:
    metadata:
      labels: { app: tinykv }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: tinykv }
              topologyKey: kubernetes.io/hostname
      containers:
        - name: tinykv
          image: tinykv:latest
          ports:
            - { name: grpc, containerPort: 7000 }
            - { name: http, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
