syntax = "proto3";

package kv.v1;

option go_package = "github.com/garvish/learning-go/tinykv/api/v1;kvv1";

service KV {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc CompareAndSwap(CASRequest) returns (CASResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message GetRequest  { bytes key = 1; bool linearizable = 2; }
message GetResponse { bytes value = 1; int64 revision = 2; bool found = 3; }

message PutRequest    { bytes key = 1; bytes value = 2; }
message PutResponse   { int64 revision = 1; }

message DeleteRequest  { bytes key = 1; }
message DeleteResponse { int64 revision = 1; }

message CASRequest  { bytes key = 1; bytes expected = 2; bytes new = 3; }
message CASResponse { bool swapped = 1; int64 revision = 2; }

message WatchRequest { bytes key_prefix = 1; int64 start_revision = 2; }
message WatchEvent {
  enum Kind { KIND_UNSPECIFIED = 0; KIND_PUT = 1; KIND_DELETE = 2; }
  Kind kind = 1; bytes key = 2; bytes value = 3; int64 revision = 4;
}
